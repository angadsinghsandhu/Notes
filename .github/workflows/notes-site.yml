name: Notes site

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: notes-site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    env:
      SOURCE_REVISION: ${{ github.sha }}
      SITE_URL: ${{ vars.SITE_URL }}
    outputs:
      artifact-id: ${{ steps.artifact.outputs.artifact-id }}
      artifact-digest: ${{ steps.artifact.outputs.artifact-digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.1
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run verify
      - id: artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: notes-site-${{ github.sha }}
          path: site/dist
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 3

  readiness:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/master' && needs.verify.result == 'success'
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.decision.outputs.configured }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.1
          package-manager-cache: false
      - id: decision
        working-directory: site
        env:
          GATES_PASSED: ${{ needs.verify.result == 'success' }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync } from 'node:fs';
          import { getDeploymentDecision } from './scripts/deploy.ts';
          const env = process.env;
          const decision = getDeploymentDecision({
            eventName: env.GITHUB_EVENT_NAME,
            ref: env.GITHUB_REF,
            gatesPassed: env.GATES_PASSED === 'true',
            projectName: env.CLOUDFLARE_PAGES_PROJECT,
            accountId: env.CLOUDFLARE_ACCOUNT_ID,
            hasToken: Boolean(env.CLOUDFLARE_API_TOKEN?.trim()),
          });
          let validSite = false;
          try {
            const url = new URL(env.SITE_URL);
            validSite = url.protocol === 'https:' && !url.username && !url.password && !url.search && !url.hash;
          } catch {}
          const configured = decision.deploy && validSite;
          const reason = decision.deploy && !validSite
            ? 'Publication disabled: valid HTTPS SITE_URL required.'
            : decision.reason;
          appendFileSync(env.GITHUB_OUTPUT, `configured=${configured}\n`);
          appendFileSync(env.GITHUB_STEP_SUMMARY, `${reason}\n`);
          NODE

  deploy:
    needs: [verify, readiness]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master' && needs.verify.result == 'success' && needs.readiness.outputs.configured == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: read
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.1
          package-manager-cache: false
      - name: Match verified artifact identity and digest
        env:
          ARTIFACT_ID: ${{ needs.verify.outputs.artifact-id }}
          EXPECTED_DIGEST: ${{ needs.verify.outputs.artifact-digest }}
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          const env = process.env;
          const id = env.ARTIFACT_ID;
          const expected = env.EXPECTED_DIGEST;
          if (!/^\d+$/.test(id) || !/^[a-f0-9]{64}$/.test(expected))
            throw new Error('Verified artifact identity/digest unavailable');
          const response = await fetch(`${env.GITHUB_API_URL}/repos/${env.GITHUB_REPOSITORY}/actions/artifacts/${id}`, {
            headers: { Authorization: `Bearer ${env.GH_TOKEN}`, Accept: 'application/vnd.github+json' },
          });
          if (!response.ok) throw new Error('Verified artifact metadata unavailable');
          const artifact = await response.json();
          if (String(artifact.id) !== id || artifact.digest !== `sha256:${expected}` || String(artifact.workflow_run.id) !== env.GITHUB_RUN_ID)
            throw new Error('Verified artifact identity/digest/run mismatch');
          NODE
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.verify.outputs.artifact-id }}
          path: dist
          digest-mismatch: error
      - name: Publish verified static artifact
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
          SOURCE_REVISION: ${{ github.sha }}
        run: npx --yes wrangler@4.147.0 pages deploy ./dist --project-name "$CLOUDFLARE_PAGES_PROJECT" --branch master --commit-hash "$SOURCE_REVISION"
